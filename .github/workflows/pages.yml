name: Deploy practice app to GitHub Pages

# 只发布 practice/ 这一个纯静态目录，其它资料不进站点。
on:
  push:
    branches: [main]
    paths:
      - "practice/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: practice
      - id: deployment
        uses: actions/deploy-pages@v4
